name: Database Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

# F-019: Minimal token permissions — prevents supply-chain attacks from
# exfiltrating the GITHUB_TOKEN with write access.
# TODO: Pin action versions to full SHA (e.g. actions/checkout@<sha>) once
# a Dependabot/Renovate workflow is in place to keep SHAs up to date.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # NEVER cancel in-progress migrations

jobs:
  migrations:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Check for new migrations
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- supabase/migrations/ 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "New migrations detected:"
            echo "$CHANGED"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No new migrations."
          fi

      - name: Apply migrations
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

          # Validate: no duplicate timestamps in committed migration files.
          # Per ADR 0019, every migration must have a unique 14-digit
          # timestamp. Same-timestamp files trip Postgres PK constraints
          # on supabase_migrations.schema_migrations and were the root cause
          # of the 2026-04-30 ghost-migration incident.
          DUPES=$(git ls-files supabase/migrations/*.sql \
            | sed 's|.*/||; s|_.*\.sql$||' \
            | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration timestamps detected: $DUPES"
            echo "Each migration must have a unique 14-digit timestamp."
            exit 1
          fi

          # Squash-baseline detection: if this push includes a *_squash_*.sql
          # file, it's a Phase 9.3-style schema baseline that mirrors prod's
          # current state (CREATE TABLE / CREATE FUNCTION without IF NOT
          # EXISTS, raw pg_dump output). Running such a file against a
          # populated prod DB would fail on every CREATE statement.
          # Per ADR-019 (manual escape hatch for known-applied migrations),
          # mark squash baselines as `applied` BEFORE the push. This adds
          # the version to schema_migrations without executing the SQL —
          # the file is then used only for fresh CI/local replay.
          NEW_SQUASH_FILES=$(git diff --name-only HEAD~1 HEAD -- 'supabase/migrations/*_squash_*.sql' 2>/dev/null || true)
          for sf in $NEW_SQUASH_FILES; do
            SQUASH_VERSION=$(basename "$sf" | sed 's/_.*//')
            echo "Detected squash baseline: $sf (version $SQUASH_VERSION)"
            echo "Marking as applied without execution per ADR-019"
            npx supabase migration repair --status applied "$SQUASH_VERSION" || true
          done

          # Detect remote-only versions (rare, but handle if they appear).
          # No proactive "mark all applied" — that step created ghost
          # migrations (metadata recorded without SQL running).
          PUSH_OUTPUT=$(npx supabase db push --linked --dry-run 2>&1 || true)
          echo "$PUSH_OUTPUT"
          REMOTE_ONLY=$(echo "$PUSH_OUTPUT" \
            | grep -oE 'repair --status reverted [0-9 ]+' \
            | sed 's/repair --status reverted //' || true)
          if [ -n "$REMOTE_ONLY" ]; then
            echo "Marking remote-only versions as reverted: $REMOTE_ONLY"
            npx supabase migration repair --status reverted $REMOTE_ONLY || true
          fi

          # Check if there are genuinely new migrations to apply
          # (local files with SQL content beyond stub comments).
          NEW_MIGRATIONS=$(git diff --name-only HEAD~1 HEAD -- supabase/migrations/ 2>/dev/null || echo "")
          HAS_REAL_SQL=false
          for f in $NEW_MIGRATIONS; do
            if [ -f "$f" ]; then
              REAL_LINES=$(grep -v '^--' "$f" | grep -v '^$' | wc -l | xargs)
              if [ "$REAL_LINES" -gt 0 ]; then
                HAS_REAL_SQL=true
                echo "Found real migration: $f ($REAL_LINES SQL lines)"
              else
                echo "Skipping stub: $f"
              fi
            fi
          done

          if [ "$HAS_REAL_SQL" = "true" ]; then
            # Push without --include-all. Supabase CLI compares local
            # files vs schema_migrations and pushes only genuinely new
            # ones. --include-all was the root cause of the 2026-04-30
            # incident: it forced re-application of already-applied
            # migrations, hitting the PK constraint on schema_migrations.
            echo "Pushing new migrations..."
            npx supabase db push --linked
          else
            echo "No new executable migrations to push (stubs only)"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migration summary
        if: always()
        run: |
          echo "## Database Migrations" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_migrations }}" = "true" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Status:** ✅ Migrations applied successfully" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Status:** ❌ Migration failed" >> $GITHUB_STEP_SUMMARY
              echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Status:** ℹ️ No new migrations detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Vercel deployments are handled automatically by Vercel GitHub App" >> $GITHUB_STEP_SUMMARY

  drift-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: migrations
    if: always()
    # Non-blocking: GitHub Actions runners are IPv4-only but Supabase pooler
    # hostnames (db.PROJECT.supabase.co:6543) have AAAA-only records — no A
    # record exists, so no DNS-preference setting can help. Until Supabase
    # adds IPv4 OR we switch to the regional pooler (aws-0-*.pooler.supabase.com),
    # the drift check fails with ENETUNREACH on every CI run. Make it
    # non-blocking so it surfaces signal when the network reaches but doesn't
    # gate the deploy on a known infrastructure limitation. Apply Migrations
    # is the real gate.
    continue-on-error: true
    # Verifies the live DB matches what migrations specify. Runs after every
    # deploy (success or failure) so out-of-band manual DB changes and silent
    # migration no-ops surface as warnings. Read-only — won't modify DB.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run advisor invariant check
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co:6543/postgres
          # GitHub Actions runners are IPv4-only; Supabase pooler hostnames
          # resolve to IPv6 first, causing ENETUNREACH. Force ipv4first DNS
          # ordering to keep the drift check working on CI.
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          if pnpm check-db-advisors; then
            echo "## Schema Drift Check" >> $GITHUB_STEP_SUMMARY
            echo "✅ Live DB matches migrations (all invariants hold)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Schema Drift Check" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Drift detected — see job logs. Investigate manual DB changes or silent migration failures." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
