name: CI

on:
  pull_request:
    branches: [main]
    # Skip CI for asset / docs / backlog PRs. Build cost saver — none of
    # these change the JS bundle, so build + bundle checks
    # are wasted minutes. Note: scripts/ is intentionally NOT here because
    # admin scripts run as service_role and need the security audit.
    # Migrations also stay in CI: branch protection requires the same 3
    # checks (Lint, Build, Security Audit) on every PR, and skipping CI
    # for a migration-only PR creates an unmerge-able PR. Drift check in
    # deploy.yml is still the authoritative integrity gate; CI on
    # migration PRs just satisfies branch protection cheaply.
    paths-ignore:
      - 'public/marketing/**'
      - 'public/screenshots/**'
      - '**/*.md'
      - 'docs/**'

# F-019: Minimal token permissions — prevents supply-chain attacks from
# exfiltrating the GITHUB_TOKEN with write access.
# TODO: Pin action versions to full SHA (e.g. actions/checkout@<sha>) once
# a Dependabot/Renovate workflow is in place to keep SHAs up to date.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max_old_space_size=8192'
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
  NEXT_PUBLIC_ENABLE_MONETIZATION: 'true'

jobs:
  # ─── Fast quality gate (lint + typecheck) ───
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache TypeScript build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint
      - run: pnpm type-check

      # Migration drift audit — catches first-create-wins drift the moment a
      # PR introduces it. Pre-2026-05-07 we discovered this class of bug only
      # via E2E failures days/weeks later (Oct-2025 incidents). Now it fires
      # at PR-time. Exit non-zero on unbackfilled drift; allow-list the
      # intentional-orphans inside the script's EXPECTED_ORPHANS set.
      - name: Migration drift audit
        run: node scripts/ci/migration-drift-audit.mjs

  # ─── Security scanning ───
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # F-006: Fail CI on HIGH+ vulnerabilities — enforces supply chain security
        run: pnpm audit --audit-level=high

      - name: Secret pattern scan
        run: |
          echo "Scanning for leaked secrets in source..."
          PATTERNS='sk_live_|sk_test_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY|ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9\-]{20}'
          MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --include="*.json" -E "$PATTERNS" . \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Potential secrets found in source code!"
            echo "$MATCHES"
            exit 1
          fi
          echo "No secrets detected."

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nextjs

  # ─── Production build + bundle analysis ───
  build:
    name: Build & Bundle Size
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - name: Bundle size budget
        # Enforces a real per-chunk budget (was warning-only before 2026-04-27).
        # Thresholds:
        #   - Hard fail: any single chunk > 750KB
        #   - Warn:      chunk between 500–750KB
        # Note on totals: sum-of-all-chunks isn't a meaningful budget for a
        # code-split Next.js app — most chunks are lazy-loaded per route, so
        # users never download the sum. The right metric is per-page first-load,
        # which the per-chunk gate catches
        # the failure mode that matters: a single fat dependency landing in one
        # chunk and tanking that page's load.
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '| File | Size | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|------|------|--------|' >> $GITHUB_STEP_SUMMARY

          WARN=0
          FAIL=0
          TOTAL_KB=0

          for f in $(find .next/static/chunks -name "*.js" -type f 2>/dev/null | sort); do
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo "0")
            SIZE_KB=$((SIZE / 1024))
            TOTAL_KB=$((TOTAL_KB + SIZE_KB))
            NAME=$(basename "$f")

            if [ "$SIZE_KB" -gt 750 ]; then
              echo "| \`$NAME\` | **${SIZE_KB}KB** | :x: FAIL (>750KB) |" >> $GITHUB_STEP_SUMMARY
              FAIL=$((FAIL + 1))
            elif [ "$SIZE_KB" -gt 500 ]; then
              echo "| \`$NAME\` | **${SIZE_KB}KB** | :warning: WARN |" >> $GITHUB_STEP_SUMMARY
              WARN=$((WARN + 1))
            elif [ "$SIZE_KB" -gt 200 ]; then
              echo "| \`$NAME\` | ${SIZE_KB}KB | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sum of all chunks: ${TOTAL_KB}KB** (informational — not a budget)" >> $GITHUB_STEP_SUMMARY
          echo "Per-chunk: $WARN warnings, $FAIL failures (>750KB hard limit)" >> $GITHUB_STEP_SUMMARY

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL chunk(s) exceed the 750KB hard limit"
            exit 1
          fi

      # Share the built output between jobs so they don't have to
      # rebuild from scratch (saves ~3-5 min of compile time per PR).
      - name: Upload .next build output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  # ─── E2E tests removed — run locally via /smoketest skill ───
  # Flaky test user auth in CI wasted 70+ hours of debugging.
  # Local skills (/smoketest, /sec-ship) provide better coverage on demand.

  # ─── Summary (always runs) ───
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, security, build]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo '| Job | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|-----|--------|' >> $GITHUB_STEP_SUMMARY

          FAILED=0

          check_job() {
            local name="$1"
            local result="$2"
            if [ "$result" = "success" ]; then
              echo "| $name | :white_check_mark: passed |" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "skipped" ]; then
              echo "| $name | :fast_forward: skipped |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | :x: $result |" >> $GITHUB_STEP_SUMMARY
              FAILED=$((FAILED + 1))
            fi
          }

          check_job "Quality" "${{ needs.quality.result }}"
          check_job "Security" "${{ needs.security.result }}"
          check_job "Build & Bundle" "${{ needs.build.result }}"

          if [ "$FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo ":x: **$FAILED job(s) failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo ":white_check_mark: **All checks passed**" >> $GITHUB_STEP_SUMMARY
