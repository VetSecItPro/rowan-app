name: Smart E2E Tests

on:
  pull_request:
    branches: [main, develop]
    # Skip E2E for PRs that can't possibly affect Playwright outcomes.
    # The 40-min Playwright suite is the dominant CI cost line, so any
    # PR that only touches docs, migrations, marketing assets, or issue
    # templates is wasted minutes. Migrations have their own drift-check
    # gate in deploy.yml; everything else here can't change UI behavior.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'public/marketing/**'
      - 'public/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CHANGELOG*.md'
      - 'LICENSE'
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency cancels superseded runs on the same ref. There's no shared
# resource anymore (every run spins up its own local Supabase), so
# cancel-in-progress is safe and saves CI minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Single consolidated job: previously seed-users + e2e + cleanup-users
  # ran across three separate runners against the production database.
  # Now each run boots its own Docker-based Supabase, so they all live
  # together in one job. Test data is destroyed when the runner is
  # cleaned up — production never sees any of it.
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    # Skip if commit message or PR title contains [skip-e2e],
    # or if the PR is still a draft (no need to burn 40 minutes
    # on work that hasn't been marked ready for review).
    if: >-
      !contains(github.event.head_commit.message || '', '[skip-e2e]') &&
      !contains(github.event.pull_request.title || '', '[skip-e2e]') &&
      github.event.pull_request.draft != true
    # Local Supabase boot adds ~60-90s; build + 25-45min test suite is
    # the bulk of the time. 60 min total leaves headroom for retries.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ─────────────────────────────────────────────────────────────────
      # Local Supabase: every run gets its own isolated database.
      # `supabase start` boots Postgres + Auth + Storage in Docker
      # containers using github-hosted runner Docker. All migrations in
      # supabase/migrations/ apply automatically on boot, so the schema
      # matches production without touching the prod DB.
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env to workflow
        run: |
          # `supabase status -o env` emits KEY="value" pairs. GITHUB_ENV
          # does NOT strip surrounding quotes — passing them through makes
          # consumers read literal `"http://..."` strings, which fail URL
          # validation in @supabase/supabase-js. Strip the quotes here.
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> $GITHUB_ENV

      - name: Seed E2E test users
        run: pnpm tsx tests/e2e/setup/seed-test-users.ts
        env:
          # API_URL / SERVICE_ROLE_KEY come from `supabase status -o env`.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Build app (pointed at local Supabase)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_ENABLE_MONETIZATION: 'true'

      - name: Run Playwright tests (against local Supabase)
        run: npx playwright test --project=chromium
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_ENABLE_MONETIZATION: 'true'
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
