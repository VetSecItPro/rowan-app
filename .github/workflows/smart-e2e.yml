name: Smart E2E Tests

on:
  pull_request:
    branches: [main, develop]
    # Skip E2E for PRs that can't possibly affect Playwright outcomes.
    # The 40-min Playwright suite is the dominant CI cost line, so any
    # PR that only touches docs, migrations, marketing assets, or issue
    # templates is wasted minutes. Migrations have their own drift-check
    # gate in deploy.yml; everything else here can't change UI behavior.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'public/marketing/**'
      - 'public/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CHANGELOG*.md'
      - 'LICENSE'
      # Vitest unit tests run in their own CI job (Lint & Type Check / Build).
      # E2E never imports __tests__/ — changes there can't move Playwright outcomes.
      - '__tests__/**'
      # One-shot ops scripts that aren't part of the runtime bundle.
      - 'scripts/**'
      # Other CI workflows have their own gates; only this file affects E2E.
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency cancels superseded runs on the same ref. There's no shared
# resource anymore (every run spins up its own local Supabase), so
# cancel-in-progress is safe and saves CI minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ─── Layer 2: smart change detection ───
  # paths-ignore (above) handles the trivial cases where the entire diff
  # is in non-runtime paths. This detector job handles the harder cases
  # paths-ignore can't express — most importantly, package.json edits
  # that only touch devDependencies. A dev-only dep change cannot affect
  # Playwright outcomes, so burning 40 min of CI on it is pure waste.
  #
  # Outputs `run_e2e` for the e2e job's `if:` gate. Skipped jobs count as
  # "passed" for required-status branch protection, so this is safe to
  # gate even when "Run E2E Tests" is required.
  detect:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          # Determine base + head SHAs for the diff.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # First push to a branch has zero base — fall back to running E2E.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
              echo "reason=initial push (no base ref to diff against)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # workflow_dispatch — operator chose to run, honor it.
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files between $base..$head:"
          echo "$changed" | sed 's/^/  /'

          # Files outside paths-ignore that DEFINITELY require E2E.
          # paths-ignore already short-circuits docs/migrations/etc., so
          # by the time we get here the diff has at least one runtime-ish
          # file. We still need to distinguish runtime code from
          # package.json devDeps-only edits.
          runtime=$(echo "$changed" | grep -E '^(app|components|lib|hooks|tests/e2e|playwright\.config|next\.config|middleware|tailwind\.config|supabase/(seed|functions)|\.github/workflows/smart-e2e\.yml)' || true)

          if [ -n "$runtime" ]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "reason=runtime files changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff includes package.json or pnpm-lock.yaml. Distinguish
          # devDependencies-only edits (safe to skip) from any change
          # that could affect runtime: production `dependencies`,
          # `pnpm.overrides` (which can rewrite runtime transitive
          # versions), or scripts that actually execute during build/
          # test/CI.
          #
          # The `scripts` field contains BOTH runtime entrypoints
          # (build, start, dev, lint, type-check, test*) AND developer
          # aliases (validate-db, perf:cwv, cap:*, analyze*) that
          # never run in CI. Comparing the whole object treats every
          # new alias as runtime-affecting and pays the 40-min E2E
          # tax for changes that can't move Playwright outcomes.
          # Slice to the known-runtime keys instead.
          RUNTIME_SCRIPT_KEYS='["dev","build","start","lint","type-check","test","test:unit","test:e2e","test:e2e:chromium","prepare","postinstall","preinstall","pretest","pretest:e2e"]'

          if echo "$changed" | grep -q '^package\.json$'; then
            before=$(git show "$base:package.json" 2>/dev/null || echo '{}')
            after=$(cat package.json)
            before_runtime=$(echo "$before" | jq -S --argjson keys "$RUNTIME_SCRIPT_KEYS" '{
              dependencies,
              pnpm,
              scripts: (.scripts // {} | to_entries | map(select(.key as $k | $keys | index($k))) | from_entries)
            }')
            after_runtime=$(echo "$after"  | jq -S --argjson keys "$RUNTIME_SCRIPT_KEYS" '{
              dependencies,
              pnpm,
              scripts: (.scripts // {} | to_entries | map(select(.key as $k | $keys | index($k))) | from_entries)
            }')

            if [ "$before_runtime" != "$after_runtime" ]; then
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
              echo "reason=package.json runtime fields changed (dependencies / pnpm.overrides / runtime scripts)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Otherwise: only devDependencies and/or non-runtime
            # script aliases moved — pnpm-lock.yaml delta is just
            # the corresponding transitive churn, also safe.
          fi

          echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          echo "reason=no runtime-affecting changes detected" >> "$GITHUB_OUTPUT"

      - name: Summarize decision
        run: |
          echo "### E2E gate decision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- run_e2e: \`${{ steps.decide.outputs.run_e2e }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  # Single consolidated job: previously seed-users + e2e + cleanup-users
  # ran across three separate runners against the production database.
  # Now each run boots its own Docker-based Supabase, so they all live
  # together in one job. Test data is destroyed when the runner is
  # cleaned up — production never sees any of it.
  e2e:
    name: Run E2E Tests
    needs: detect
    runs-on: ubuntu-latest
    # Skip when:
    # - detector says no runtime-affecting changes, or
    # - commit message / PR title contains [skip-e2e], or
    # - the PR is still a draft.
    if: >-
      needs.detect.outputs.run_e2e == 'true' &&
      !contains(github.event.head_commit.message || '', '[skip-e2e]') &&
      !contains(github.event.pull_request.title || '', '[skip-e2e]') &&
      github.event.pull_request.draft != true
    # Local Supabase boot adds ~60-90s; build + 25-45min test suite is
    # the bulk of the time. 60 min total leaves headroom for retries.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ─────────────────────────────────────────────────────────────────
      # Local Supabase: every run gets its own isolated database.
      # `supabase start` boots Postgres + Auth + Storage in Docker
      # containers using github-hosted runner Docker. All migrations in
      # supabase/migrations/ apply automatically on boot, so the schema
      # matches production without touching the prod DB.
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env to workflow
        run: |
          # `supabase status -o env` emits KEY="value" pairs. GITHUB_ENV
          # does NOT strip surrounding quotes — passing them through makes
          # consumers read literal `"http://..."` strings, which fail URL
          # validation in @supabase/supabase-js. Strip the quotes here.
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> $GITHUB_ENV

      - name: Seed E2E test users
        run: pnpm tsx tests/e2e/setup/seed-test-users.ts
        env:
          # API_URL / SERVICE_ROLE_KEY come from `supabase status -o env`.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # Schema-drift audit. Verifies the schema produced by all
      # migrations matches what application code references via
      # service-level select() column lists. Fails fast (~5s) with a
      # clear error if drift is detected — turns 40-min Playwright
      # timeouts into actionable PGRST204 / 42703 fix-the-migration
      # signals. Added 2026-05-06 after Phase 8 baseline repair found
      # 4 distinct schema-correctness bugs masked by squashed history.
      - name: Schema-drift audit
        run: pnpm tsx scripts/ci/schema-check.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Build app (pointed at local Supabase)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_ENABLE_MONETIZATION: 'true'

      - name: Run Playwright tests (against local Supabase)
        run: npx playwright test --project=chromium
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_ENABLE_MONETIZATION: 'true'
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
